name: Publish Alfameta GHCR Image

on:
  push:
    branches:
      - update-whatsmeow-20260821
  workflow_dispatch:

jobs:
  publish:
    name: Build and Push GHCR Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/evolution-go:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/evolution-go:whatsmeow-20260821
            ghcr.io/${{ github.repository_owner }}/evolution-go:alfameta-latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Evolution GO Alfameta fork with updated whatsmeow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
